name: Trusted Autobump Automerge

on:
  workflow_run:
    workflows:
      - Build, Test and Upload Bottles
    types:
      - completed

permissions:
  contents: read

jobs:
  automerge:
    if: >
      github.repository_owner == 'MaaAssistantArknights' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - name: Label and Dispatch Trusted Autobump PRs
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const run = context.payload.workflow_run;

            let number = run.pull_requests?.[0]?.number;
            if (!number) {
              const associated = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner,
                  repo,
                  commit_sha: run.head_sha,
                  per_page: 100,
                },
              );
              const open = associated.filter((pr) => pr.state === 'open');
              if (open.length !== 1) {
                core.notice(`Expected exactly one open PR for ${run.head_sha}; found ${open.length}.`);
                return;
              }
              number = open[0].number;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: number,
            });

            if (pr.state !== 'open') {
              core.notice(`PR #${number} is ${pr.state}; skipping.`);
              return;
            }

            if (pr.draft) {
              core.notice(`PR #${number} is draft; skipping.`);
              return;
            }

            if (pr.base.ref !== defaultBranch) {
              core.notice(`PR #${number} targets ${pr.base.ref}, not ${defaultBranch}; skipping.`);
              return;
            }

            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.notice(`PR #${number} comes from ${pr.head.repo.full_name}; skipping.`);
              return;
            }

            if (!pr.head.ref.startsWith('bump-')) {
              core.notice(`PR #${number} branch ${pr.head.ref} is not an autobump branch; skipping.`);
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: number,
              per_page: 100,
            });

            const allowedFile = /^(Formula|Casks)\/[^/]+\.rb$/;
            const unexpectedFiles = files
              .map(({ filename }) => filename)
              .filter((filename) => !allowedFile.test(filename));

            if (unexpectedFiles.length > 0) {
              core.notice(
                `PR #${number} changes unsupported files: ${unexpectedFiles.join(', ')}; skipping.`,
              );
              return;
            }

            const hasAutomergeLabel = pr.labels.some(({ name }) => name === 'Automerge');
            if (hasAutomergeLabel) {
              core.notice(`PR #${number} already has Automerge; skipping.`);
              return;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: number,
              labels: ['Automerge'],
            });

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'publish.yml',
              ref: defaultBranch,
              inputs: {
                pull_request: `${number}`,
              },
            });

            core.notice(`Added Automerge to PR #${number} and dispatched publish.yml.`);
