name: Publish Bottles and Merge PR
on:
  pull_request_target:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        type: number
        required: true
concurrency:
  group: publish-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  pr-pull:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'Automerge')
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/homebrew/ubuntu22.04:master
    permissions:
      actions: write
      pull-requests: write
      contents: write
      packages: write
    env:
      PR: ${{ github.event.pull_request.number || inputs.pull_request }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false
          test-bot: false

      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Load PR Metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_json="$(
            gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/pulls/$PR"
          )"

          head_ref="$(jq --raw-output '.head.ref' <<< "$pr_json")"
          head_repo_clone_url="$(jq --raw-output '.head.repo.clone_url' <<< "$pr_json")"

          if [[ -z "$head_ref" ]] || [[ -z "$head_repo_clone_url" ]]; then
            echo 'Failed to load pull request metadata.'
            exit 1
          fi

          {
            echo "head_ref=$head_ref"
            echo "head_repo_clone_url=$head_repo_clone_url"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout PR Branch
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout "$PR"

      - name: Pull and Publish Bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          PULL_REQUEST: ${{ env.PR }}
        run: |
          brew pr-pull \
            --debug \
            --clean \
            --no-cherry-pick \
            --artifact-pattern 'bottles_*' \
            --tap="$GITHUB_REPOSITORY" \
            --workflows ci.yml \
            "$PR"

      - name: Push commits to PR branch
        uses: Homebrew/actions/git-try-push@master
        with:
          token: ${{ github.token }}
          branch: ${{ steps.pr.outputs.head_ref }}
          remote: ${{ steps.pr.outputs.head_repo_clone_url }}
          directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - name: Wait for Remote Branch to be Updated
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: |
          local_head=$(git rev-parse HEAD)
          remote_ref="pull/${PR}/head"

          attempt=0
          max_attempts=10
          timeout=1

          # Wait (with exponential backoff) until the PR branch is in sync
          while [[ "$attempt" -lt "$max_attempts" ]]; do
            remote_head="$(git ls-remote origin "$remote_ref" | cut -f1)"
            if [[ "$local_head" = "$remote_head" ]]
            then
              success=1
              break
            fi
            sleep "$timeout"
            attempt=$(( attempt + 1 ))
            timeout=$(( timeout * 2 ))
          done

          if [[ "$success" -ne 1 ]]; then
            echo "Remote branch not updated after ${max_attempts} attempts"
            exit 1
          fi

      - name: Approve Pull Request
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr review "$PR" --approve

      - name: Enable Auto Merge
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "$PR" \
            --merge \
            --delete-branch
